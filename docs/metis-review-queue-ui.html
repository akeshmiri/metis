<div style="max-width:900px;margin:0 auto;font-family:var(--font-sans)">
<h2 class="sr-only">Métis review queue — quarantine-tier items awaiting human confirmation</h2>

<div style="background:var(--surface-1);border:0.5px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px" id="demo-data-panel">
  <div>
    <p style="margin:0;font-size:13px;font-weight:500">Demo data</p>
    <p style="margin:2px 0 0;font-size:12px;color:var(--text-muted)" id="demo-data-status">Checking…</p>
  </div>
  <div style="display:flex;gap:8px">
    <button id="demo-data-load-btn" style="font-size:13px">Load demo data</button>
    <button id="demo-data-wipe-btn" style="font-size:13px">Wipe demo data</button>
  </div>
</div>

<div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:8px">
  <div>
    <h1 style="margin:0 0 4px">Review queue</h1>
    <p style="margin:0;color:var(--text-secondary);font-size:14px">Quarantine-tier items — nothing here reaches Approved without a decision below.</p>
  </div>
  <div style="display:flex;gap:8px" id="scope-pills"></div>
</div>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:1.5rem" id="stat-cards"></div>

<div style="display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap" id="filters"></div>

<div id="queue-list"></div>

<div id="detail-overlay" style="display:none;min-height:400px;position:static"></div>
</div>

<script>
// Phase 5: real items fetched from review_api_server.py's /api/quarantine
// endpoint (a real Cypher query against Neo4j, `WHERE n.lifecycle_state =
// 'Quarantine'`), not a hardcoded sample array. See that file's docstring
// for why this is a narrow, purpose-built endpoint rather than the full
// production Streamable HTTP MCP transport (Phase 6, not built yet).
let items = [];

function riskKey(riskTag) {
  if (!riskTag) return 'low';
  const k = riskTag.toLowerCase();
  return (k === 'high' || k === 'medium' || k === 'low') ? k : 'low';
}

function toDisplayItem(raw) {
  // raw fields are exactly what's really on the Neo4j node -- id, name,
  // source_file, lineno, risk_tag, triage_reason, source_episode_id.
  // No invented "Requirement text says X, code shows Y" narrative content:
  // this phase's guardrail stack (Layer 2/3 only, no Layer 6 judge yet)
  // doesn't produce that kind of comparison, so the UI shows what's
  // actually true about the entity instead of fabricating a scenario.
  const entity = (raw.labels || []).find(l => l !== 'Quarantine') || raw.labels?.[0] || 'Entity';
  const reason = raw.triage_reason || 'unclassified';
  const location = raw.source_file ? `${raw.source_file}${raw.lineno ? ':' + raw.lineno : ''}` : 'unknown location';
  return {
    id: raw.id,
    entity,
    risk: riskKey(raw.risk_tag),
    reason,
    title: `${entity} '${raw.name || raw.id}' has no corroborating second source`,
    summary: `This ${entity} was structurally extracted and passed Layer 2 validation, but landed in `
            + `Quarantine (not auto-written) because it currently has only one source and no `
            + `independent corroboration (Layer 4) has run against it yet.`,
    sources: [
      { name: 'application-code connector (Phase 2)', verdict: location },
    ],
    checklist: [
      'I have looked at the real source location for this entity.',
      'I understand this entity currently has exactly one source and has not been independently corroborated.',
      'I have decided whether this should be approved as-is or needs further verification before Approved.',
    ],
    entityMeta: `${raw.id}${raw.source_episode_id ? ' · ' + raw.source_episode_id : ''}`,
  };
}

async function loadItems() {
  const list = document.getElementById('queue-list');
  list.innerHTML = '<p style="color:var(--text-muted);font-size:14px;text-align:center;padding:2rem 0">Loading real quarantine items…</p>';
  try {
    const res = await fetch('/api/quarantine');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();
    items = raw.map(toDisplayItem);
  } catch (err) {
    list.innerHTML = `<p style="color:var(--text-muted);font-size:14px;text-align:center;padding:2rem 0">`
      + `Could not reach the review API (${err.message}). Run review_api_server.py and load this page from `
      + `http://127.0.0.1:8420/ (not file://).</p>`;
    return;
  }
  render();
}

// Demo data panel -- real one-click load/wipe against
// demo_data/generate_demo_data.py via review_api_server.py's real
// /api/demo-data/* endpoints (not a mock UI affordance).
async function refreshDemoDataStatus() {
  const statusEl = document.getElementById('demo-data-status');
  try {
    const res = await fetch('/api/demo-data/status');
    const data = await res.json();
    statusEl.textContent = data.demo_nodes > 0
      ? `${data.demo_nodes.toLocaleString()} demo node(s) currently loaded.`
      : 'No demo data loaded yet.';
  } catch (err) {
    statusEl.textContent = `Could not reach the review API (${err.message}).`;
  }
}

function wireDemoDataButtons() {
  const statusEl = document.getElementById('demo-data-status');
  const loadBtn = document.getElementById('demo-data-load-btn');
  const wipeBtn = document.getElementById('demo-data-wipe-btn');

  loadBtn.onclick = async () => {
    loadBtn.disabled = true;
    wipeBtn.disabled = true;
    statusEl.textContent = 'Loading demo data (~2-5s: real EARS checks, real confidence tiering, real determinism checks)…';
    try {
      const res = await fetch('/api/demo-data/load', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scale: 1.0 }),
      });
      const data = await res.json();
      if (data.ok) {
        statusEl.textContent = `Loaded ${data.summary.total_nodes.toLocaleString()} nodes, `
          + `${data.summary.total_relationships.toLocaleString()} relationships across `
          + `${Object.keys(data.summary.nodes_by_label).length} types.`;
        await loadItems();  // real Quarantine-tier demo Requirements now show up too
      } else {
        statusEl.textContent = `Load failed: ${data.error}`;
      }
    } catch (err) {
      statusEl.textContent = `Could not reach the review API (${err.message}).`;
    }
    loadBtn.disabled = false;
    wipeBtn.disabled = false;
  };

  wipeBtn.onclick = async () => {
    loadBtn.disabled = true;
    wipeBtn.disabled = true;
    statusEl.textContent = 'Wiping demo data…';
    try {
      const res = await fetch('/api/demo-data/wipe', { method: 'POST' });
      const data = await res.json();
      statusEl.textContent = data.ok ? `Wiped ${data.deleted.toLocaleString()} demo node(s).` : `Wipe failed: ${data.error}`;
      await loadItems();
    } catch (err) {
      statusEl.textContent = `Could not reach the review API (${err.message}).`;
    }
    loadBtn.disabled = false;
    wipeBtn.disabled = false;
  };
}

const riskMeta = {
  high:   { label: 'High risk',   ramp: 'red'   },
  medium: { label: 'Medium risk', ramp: 'amber' },
  low:    { label: 'Low risk',    ramp: 'gray'  },
};

let activeFilter = 'all';
let decided = {};

function pill(text, active, onClick) {
  const el = document.createElement('button');
  el.textContent = text;
  el.style.cssText = `font-size:13px;padding:6px 14px;border-radius:999px;border:0.5px solid ${active ? 'var(--border-accent)' : 'var(--border)'};background:${active ? 'var(--bg-accent)' : 'var(--surface-2)'};color:${active ? 'var(--text-accent)' : 'var(--text-secondary)'};cursor:pointer`;
  el.onclick = onClick;
  return el;
}

function renderStats() {
  const counts = { high: 0, medium: 0, low: 0 };
  items.forEach(i => { if (!decided[i.id]) counts[i.risk]++; });
  const total = counts.high + counts.medium + counts.low;
  const wrap = document.getElementById('stat-cards');
  wrap.innerHTML = '';
  const cards = [
    { label: 'Awaiting review', value: total },
    { label: 'High risk', value: counts.high },
    { label: 'Medium risk', value: counts.medium },
    { label: 'Low risk', value: counts.low },
  ];
  cards.forEach(c => {
    const d = document.createElement('div');
    d.style.cssText = 'background:var(--surface-1);border-radius:var(--radius);padding:1rem';
    d.innerHTML = `<div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px">${c.label}</div><div style="font-size:24px;font-weight:500">${c.value}</div>`;
    wrap.appendChild(d);
  });
}

function renderFilters() {
  const wrap = document.getElementById('filters');
  wrap.innerHTML = '';
  const options = [['all','All'], ['high','High risk'], ['medium','Medium risk'], ['low','Low risk']];
  options.forEach(([key, label]) => {
    wrap.appendChild(pill(label, activeFilter === key, () => { activeFilter = key; render(); }));
  });
}

function card(item) {
  const rm = riskMeta[item.risk];
  const isDone = !!decided[item.id];
  const div = document.createElement('div');
  div.style.cssText = `background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px;${isDone ? 'opacity:0.55' : ''}`;

  const badge = document.createElement('span');
  badge.className = `c-${rm.ramp}`;
  badge.style.cssText = 'font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;display:inline-block';
  badge.textContent = rm.label;

  const header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap';
  header.appendChild(badge);
  const entityTag = document.createElement('span');
  entityTag.style.cssText = 'font-size:12px;color:var(--text-muted)';
  entityTag.textContent = item.entity + ' · ' + item.reason.replace(/_/g,' ');
  header.appendChild(entityTag);

  const title = document.createElement('p');
  title.style.cssText = 'font-weight:500;font-size:15px;margin:0 0 4px';
  title.textContent = item.title;

  const meta = document.createElement('p');
  meta.style.cssText = 'font-size:12px;color:var(--text-muted);margin:0 0 10px';
  meta.textContent = item.entityMeta;

  const summary = document.createElement('p');
  summary.style.cssText = 'font-size:14px;color:var(--text-secondary);margin:0 0 12px;line-height:1.6';
  summary.textContent = item.summary;

  div.appendChild(header);
  div.appendChild(title);
  div.appendChild(meta);
  div.appendChild(summary);

  if (isDone) {
    const doneLabel = document.createElement('p');
    doneLabel.style.cssText = 'font-size:13px;font-weight:500';
    doneLabel.textContent = decided[item.id].startsWith('approved')
      ? 'Approved (decision noted, not written — REQ-METIS-CPT-01)'
      : 'Rejected (decision noted, not written — REQ-METIS-CPT-01)';
    div.appendChild(doneLabel);
  } else {
    const btn = document.createElement('button');
    btn.textContent = 'Review';
    btn.style.cssText = 'font-size:13px';
    btn.onclick = () => openDetail(item);
    div.appendChild(btn);
  }
  return div;
}

function openDetail(item) {
  const overlay = document.getElementById('detail-overlay');
  overlay.style.cssText = 'display:flex;align-items:center;justify-content:center;min-height:520px;background:rgba(0,0,0,0.45);border-radius:12px;padding:2rem 0';

  const rm = riskMeta[item.risk];
  const checks = item.checklist.map((c, idx) => `
    <label style="display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;margin-bottom:10px;cursor:pointer">
      <input type="checkbox" data-check="${idx}" style="margin-top:3px" />
      <span>${c}</span>
    </label>`).join('');

  const sources = item.sources.map(s => `
    <div style="border:0.5px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px">
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:2px">${s.name}</div>
      <div style="font-size:14px">${s.verdict}</div>
    </div>`).join('');

  const modal = document.createElement('div');
  modal.style.cssText = 'background:var(--surface-2);border-radius:12px;max-width:600px;width:90%;padding:1.5rem;max-height:80vh;overflow:auto';
  modal.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">
      <span class="c-${rm.ramp}" style="font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px">${rm.label}</span>
      <button id="close-detail" aria-label="Close" style="border:none;background:none;padding:4px;cursor:pointer"><i class="ti ti-x" style="font-size:18px"></i></button>
    </div>
    <h3 style="margin:8px 0 4px">${item.title}</h3>
    <p style="font-size:12px;color:var(--text-muted);margin:0 0 16px">${item.entityMeta}</p>
    <p style="font-size:14px;color:var(--text-secondary);line-height:1.6;margin:0 0 16px">${item.summary}</p>
    <p style="font-size:13px;font-weight:500;margin:0 0 8px">Sources evaluated</p>
    ${sources}
    <p style="font-size:13px;font-weight:500;margin:16px 0 8px">Before you decide</p>
    ${checks}
    <div id="decision-note" style="display:none;font-size:13px;color:var(--text-secondary);background:var(--surface-1);border-radius:var(--radius);padding:10px 12px;margin-top:12px;line-height:1.5"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="approve-btn" disabled style="flex:1"><i class="ti ti-check" style="font-size:16px;vertical-align:-3px;margin-right:4px"></i>Approve</button>
      <button id="reject-btn" style="flex:1"><i class="ti ti-x" style="font-size:16px;vertical-align:-3px;margin-right:4px"></i>Reject</button>
    </div>
  `;
  overlay.innerHTML = '';
  overlay.appendChild(modal);

  const checkboxes = modal.querySelectorAll('input[type=checkbox]');
  const approveBtn = modal.querySelector('#approve-btn');
  const rejectBtn = modal.querySelector('#reject-btn');
  const note = modal.querySelector('#decision-note');
  function updateApprove() {
    const allChecked = Array.from(checkboxes).every(c => c.checked);
    approveBtn.disabled = !allChecked;
    approveBtn.style.opacity = allChecked ? '1' : '0.5';
  }
  checkboxes.forEach(c => c.addEventListener('change', updateApprove));
  updateApprove();

  // Calls the real /api/decision endpoint -- per PLAN.md Phase 5's explicit
  // instruction, the write path (REQ-METIS-CPT-01) stays disabled, so this
  // shows the honest "noted but not written" response rather than silently
  // marking the item as if the decision were persisted.
  async function sendDecision(decision, button) {
    button.disabled = true;
    try {
      const res = await fetch('/api/decision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: item.id, decision }),
      });
      const data = await res.json();
      note.style.display = 'block';
      note.textContent = data.reason || 'No response reason returned.';
      decided[item.id] = decision === 'approved' ? 'approved (not written)' : 'rejected (not written)';
    } catch (err) {
      note.style.display = 'block';
      note.textContent = `Could not reach the review API (${err.message}).`;
      button.disabled = false;
      return;
    }
    setTimeout(() => { overlay.style.display = 'none'; render(); }, 1400);
  }

  modal.querySelector('#close-detail').onclick = () => { overlay.style.display = 'none'; };
  approveBtn.onclick = () => sendDecision('approved', approveBtn);
  rejectBtn.onclick = () => sendDecision('rejected', rejectBtn);
}

function render() {
  renderStats();
  renderFilters();
  const list = document.getElementById('queue-list');
  list.innerHTML = '';
  const filtered = items.filter(i => activeFilter === 'all' || i.risk === activeFilter);
  if (filtered.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:14px;text-align:center;padding:2rem 0">No items match this filter.</p>';
  } else {
    filtered.forEach(i => list.appendChild(card(i)));
  }
}

wireDemoDataButtons();
refreshDemoDataStatus();
loadItems();
</script>
