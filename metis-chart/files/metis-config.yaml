# Métis configuration -- rendered by the Helm chart into a Secret and mounted at
# the path METIS_CONFIG_PATH names (see values.yaml and ../README.md).
#
# METIS_CONFIG_PATH, when set, is the ONLY candidate the server considers
# (`metis_mcp/mbt/graph_session.py::config_paths`), which is the whole point of
# the deployment contract: a pod must not fall back to whatever the node
# happened to have. A project-level `.metis/config.*` inside a checkout the
# worker operates on does NOT override this -- that override was removed
# deliberately, and the `config_manager.py` this header used to cite went with
# the v1 engine.

zdr:
  # Zero Data Retention status for the adopting organization.
  #
  # NOTHING READS THIS, AND THERE IS NO GATE. `CONST-051`..`CONST-053` are v1
  # constitution rules, absent from the current specification and from every
  # module in this build. An earlier version of this comment said a
  # `confidential` repository is "blocked at the gate"; no such gate exists.
  # Kept as the record of a policy decision -- not as a control that is running.
  #
  # Procurement checklist, historical:
  # docs/historical/design-notes-v1/metis-const-053-confirmation-record.md
  confirmed: false
  confirmed_date: null
  confirmed_by: null
  note: >
    REPLACE: record the ZDR decision, its date, and the reasoning. Until this
    is filled in, treat the fail-closed default above as intentional rather
    than as an unfinished task.

models:
  extraction: claude-haiku-4-5-20251001
  judge: claude-sonnet-5

corpus:
  glob: "corpus/*.md"

# Graph connection, transport, and connector connection settings. password_env
# values name the Secret keys templates/secrets.yaml actually creates
# (METIS_SOURCE_DB_PASSWORD, NEO4J_PASSWORD) -- wired into every container via
# envFrom/secretRef in _objects.tpl.
#
# The uri/host values below are what the deployment actually uses. They are NOT
# overridden by NEO4J_URI or METIS_SOURCE_DB_HOSTNAME at runtime: the server
# reads this rendered file through METIS_CONFIG_PATH (see ../README.md), and the
# config_manager.py that once applied such an override went with the v1 engine.
# Set the real per-environment value here, via values.yaml, not through an env
# var that nothing reads.
#
# There is no `backend` key: the v1 LocalGraphStore/Neo4jGraphStore split is
# gone and a key naming a choice that no longer exists reads as a supported
# control.
graph:
  neo4j:
    uri: "bolt://REPLACE-neo4j-service:7687"
    user: "neo4j"
    password_env: "NEO4J_PASSWORD"

server:
  transport: streamable-http
  # public_url: "REPLACE: real externally-reachable Streamable HTTP URL,
  #   e.g. https://REPLACE-metis-host.example.com/mcp -- consumed by
  #   metis_mcp/copilot_integration.py to generate the real Copilot
  #   discovery file (.github/agents/spec-aware.agent.md). Unset until a
  #   real hostname/OAuth2 provider is chosen for this deployment.

security:
  jwt_secret_env: "OAUTH_CLIENT_SECRET"

connectors:
  application_code:
    source_database:
      host: "localhost"
      port: 5432
      dbname: "CHANGE_ME"
      user: "CHANGE_ME"
      password_env: "METIS_SOURCE_DB_PASSWORD"

# Per-repository classification. NOTHING READS THIS EITHER -- see the note under
# `zdr` above. It is a declaration of intent, not an ingestion control.
#
# The intended rule was that every repository Métis ingests carries an explicit
# entry, and that anything NOT listed defaults to `confidential` (fail-closed)
# and is blocked rather than silently treated as safe. No code implements it.
#
# Given the ZDR decision above, most repositories should genuinely be
# `public_internal` unless a specific one has a real contractual, regulatory,
# or embedded-secrets reason to be stricter -- see the classification
# discussion for guidance on which is which. Defaulting everything to
# `confidential` "to be safe" just means nothing ingests; that's not actually
# safer, it's just inert.
repositories:
  - name: metis-self
    classification: public_internal
    note: "This platform's own design documents -- the Phase 0 dogfooding corpus."

  # - name: REPLACE-your-repo-name
  #   classification: public_internal | confidential | restricted
  #   note: "REPLACE: why this classification, in one line"
