# Métis Helm chart values
# Single chart, `components:` map, shared deployment/service/configmap
# templates -- a conventional shape, not a bespoke one.

default:
  # **Every variable here is read by the code.** This block carried ten that
  # were not: `LOG_LEVEL`, `METIS_LOG_LEVEL`, five `METIS_SOURCE_DB_*` (the
  # database layer was staged out in the 2026-08-31 re-baseline) and, in the
  # component below, four `OAUTH_*` and a misspelled transport. A chart that
  # sets variables nothing reads is a chart nobody can reason about: it looks
  # configured and is not. `ci.yml`'s `chart` job now renders this and fails on
  # a name no module reads.
  env:
    # The one that decides what this deployment is ALLOWED to do, and it was
    # set nowhere -- so every deployment silently took the default. Stated
    # explicitly for that reason: `off` should be a choice, not an accident.
    - name: METIS_MCP_WRITE
      value: "off"          # off | author | full  (N-8)
    # Contact with the system under test. Same argument (X-7a).
    - name: METIS_EXECUTE
      value: "off"          # off | observe | run
    # The second key on a live publication. A G2 confirmation can be supplied by
    # whatever drives a run, including an agent; this cannot (T-20).
    - name: METIS_ALLOW_EXTERNAL_WRITES
      value: "no"

  envOverrides: []

  image:
    registry: "REPLACE: your container registry hostname, e.g. registry.example.com"
    repository: "REPLACE: your image path, e.g. my-org/metis-services"
    tag: "1.0.0"
    pullPolicy: Always
    pullSecrets: []

  replicas: 1
  revisionHistoryLimit: 10

  schedulingRules:
    nodeSelector: {}
    affinity: {}
    tolerations: []

  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true

# secrets.yaml's real values are injected via --set-string at install time
# (never committed here) -- this empty map exists so `.Values.secrets.foo`
# resolves to nil safely instead of erroring on a nil pointer, letting each
# key's own `| default "REPLACE-AT-INSTALL-TIME"` actually take effect. Real
# bug found the first time `helm lint` was ever run against this chart: with
# no `secrets:` key at all, `.Values.secrets.sourceDbPassword` failed before
# the `default` pipeline stage ran, regardless of what it would default to.
secrets: {}
  # neo4jPassword: ""     # the only one with a reader

external:
  enabled: true

ingress:
  enabled: true
  # MCP server transport is Streamable HTTP (client-agnostic -- Claude Code, Claude
  # Desktop, and GitHub Copilot Agent mode all speak the same MCP-over-HTTP
  # protocol; this is not a Copilot-specific or Claude-specific endpoint).
  host: "REPLACE: e.g. metis.internal.example.com"
  tls:
    enabled: true
    secretName: "REPLACE"

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---- Neo4j Enterprise (or Community for Phase 0 — see the risk register) ----
# Deployed as a subchart dependency (the official Neo4j Helm chart), not a
# hand-rolled StatefulSet — clustering, backup, and RBAC are Neo4j's own
# well-tested chart's job, not something to reimplement here.
neo4j:
  enabled: true
  edition: "community"  # REPLACE: "enterprise" once licensing (§15) is budgeted for Phase 1+
  acceptLicenseAgreement: "no"  # REPLACE: "yes" only after actually accepting Neo4j's license terms
  neo4j:
    name: "metis"
    password: "REPLACE — use a real secret reference, never a literal value in committed values.yaml"
  volumes:
    data:
      mode: "dynamic"
      dynamic:
        storageClassName: "REPLACE"
  resources:
    requests:
      memory: 4Gi
      cpu: 1000m
    limits:
      memory: 8Gi
      cpu: 2000m

# ---- Métis's own components ----
# Grafana and the Postgres episode-log-that-no-longer-exists are deliberately
# NOT components here -- guardrail/DQ metrics are new panels on an existing
# existing Grafana (§12.4), and the episode log lives in the Neo4j database
# above (single-database decision) -- both reuse infrastructure that already
# exists rather than duplicating it.
components:
  mcp-server:
    enabled: true
    ports:
      - name: http
        value: 8090
    imageOverride:
      name: "metis-mcp-server"
    useDefault:
      env: true
    env:
      # **The name the code reads.** This said `MCP_TRANSPORT`, which nothing
      # reads, so the container fell back to `stdio` -- waiting on a stdin
      # nobody is attached to while publishing a port nothing listened on.
      # `server.main()`'s docstring describes exactly that failure as fixed;
      # the fix could never reach a deployment through the wrong variable.
      - name: METIS_MCP_TRANSPORT
        value: "streamable-http"
      # Unset, this binds 127.0.0.1 -- which inside a pod means the pod itself,
      # so the Service would reach nothing even with the transport correct.
      #
      # The server prints a warning when this is not loopback, and the warning
      # is right: this surface does not authenticate. It cannot approve or
      # publish (N-8), and it will read out every requirement and criterion in
      # the graph to whoever reaches it. That is bounded here by cluster
      # networking and nothing else -- see README, "What this does not do".
      - name: METIS_HTTP_HOST
        value: "0.0.0.0"
      - name: METIS_HTTP_PORT
        value: "8090"
      # Read from the environment, never from an argument and never from a
      # literal in a file (PLT-005). The mounted config names this variable
      # rather than carrying the secret.
      - name: METIS_NEO4J_PASSWORD
        valueFrom:
          secretKeyRef:
            name: "{{ .Release.Name }}-secrets"
            key: METIS_NEO4J_PASSWORD
      # Real bug found deploying this to a real cluster: this component had
      # no METIS_CONFIG_PATH/mountedSecrets at all, so it had no way to ever
      # find config.json and halted on startup, every time, regardless of image
      # content. (The v1 config_manager.py that raised there is gone; the
      # deployment contract it enforced is not.)
      - name: METIS_CONFIG_PATH
        value: "/etc/metis/config/config.json"
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 1000m
    # **`/healthz` is on the HTTP API, not on this process.** Verified by running
    # the container's entrypoint: `metis-mcp-server` serves `/mcp` and answers
    # 404 for `/healthz`, so this probe failed every time and Kubernetes
    # restarted the pod in a loop.
    #
    # A TCP probe rather than a corrected HTTP one, deliberately. `/mcp` answers
    # 406 without an `Accept: text/event-stream` header -- alive, and a probe
    # would read it as failure -- and encoding a protocol handshake into a
    # liveness check makes the check wrong whenever the protocol moves. This
    # asserts less: the process is listening. That is what liveness means.
    livenessProbe:
      tcpSocket:
        port: 8090
      initialDelaySeconds: 10
      periodSeconds: 15
    mountedSecrets:
      - name: metis-config
        mountPath: /etc/metis/config/config.json
        subPath: config.json
