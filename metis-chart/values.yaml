# Métis Helm chart values
# Single chart, `components:` map, shared deployment/service/configmap
# templates -- a conventional shape, not a bespoke one.

default:
  env:
    - name: LOG_LEVEL
      value: "WARN"
    - name: METIS_LOG_LEVEL
      value: "WARN"
    # Athena connectivity -- Métis reads FROM an existing Athena Postgres, per
    # the athena_internal_read protocol (§3.3, §6 of the master spec). This is
    # NOT a new database deployment -- these are connection details to an
    # already-running instance.
    #
    # Defaults target a local Postgres so a fresh checkout works out of the box.
    # For an in-cluster deployment, override ATHENA_DB_HOSTNAME with the real
    # service DNS name -- `localhost` resolves to the pod itself, not a database.
    # ATHENA_DB_USERNAME should be a read-only role scoped to the schema-catalog
    # objects Métis reads (CONST-052-adjacent least-privilege); do not reuse a
    # write-capable service account.
    - name: ATHENA_DB_HOSTNAME
      value: "localhost"
    - name: ATHENA_DB_PORT
      value: "5432"
    - name: ATHENA_DB_DATABASE
      value: "athena"
    - name: ATHENA_DB_USERNAME
      value: "athena"
    # LLM vendor call routing config (ZDR status, model names, classifications)
    # lives ENTIRELY in the mounted metis-config Secret below, not as
    # individual env vars here -- this is the "no configuration in code"
    # directive applied to the chart itself, not just the Python package.
    # See metis_mcp/config_manager.py for the resolution logic that reads it.

  envOverrides: []

  image:
    registry: "REPLACE: your container registry hostname, e.g. registry.example.com"
    repository: "REPLACE: your image path, e.g. my-org/metis-services"
    tag: "0.1.0"
    pullPolicy: Always
    pullSecrets: []

  replicas: 1
  revisionHistoryLimit: 10

  schedulingRules:
    nodeSelector: {}
    affinity: {}
    tolerations: []

  securityContext:
    runAsNonRoot: true
    readOnlyRootFilesystem: true

# secrets.yaml's real values are injected via --set-string at install time
# (never committed here) -- this empty map exists so `.Values.secrets.foo`
# resolves to nil safely instead of erroring on a nil pointer, letting each
# key's own `| default "REPLACE-AT-INSTALL-TIME"` actually take effect. Real
# bug found the first time `helm lint` was ever run against this chart: with
# no `secrets:` key at all, `.Values.secrets.athenaDbPassword` failed before
# the `default` pipeline stage ran, regardless of what it would default to.
secrets: {}
  # athenaDbPassword: ""
  # neo4jPassword: ""
  # anthropicApiKey: ""
  # oauthClientSecret: ""

external:
  enabled: true

ingress:
  enabled: true
  # MCP server transport is Streamable HTTP (client-agnostic -- Claude Code, Claude
  # Desktop, and GitHub Copilot Agent mode all speak the same MCP-over-HTTP
  # protocol; this is not a Copilot-specific or Claude-specific endpoint).
  host: "REPLACE: e.g. metis.internal.example.com"
  tls:
    enabled: true
    secretName: "REPLACE"

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---- Neo4j Enterprise (or Community for Phase 0 — see the risk register) ----
# Deployed as a subchart dependency (the official Neo4j Helm chart), not a
# hand-rolled StatefulSet — clustering, backup, and RBAC are Neo4j's own
# well-tested chart's job, not something to reimplement here.
neo4j:
  enabled: true
  edition: "community"  # REPLACE: "enterprise" once licensing (§15) is budgeted for Phase 1+
  acceptLicenseAgreement: "no"  # REPLACE: "yes" only after actually accepting Neo4j's license terms
  neo4j:
    name: "metis"
    password: "REPLACE — use a real secret reference, never a literal value in committed values.yaml"
  volumes:
    data:
      mode: "dynamic"
      dynamic:
        storageClassName: "REPLACE"
  resources:
    requests:
      memory: 4Gi
      cpu: 1000m
    limits:
      memory: 8Gi
      cpu: 2000m

# ---- Métis's own components ----
# Grafana and the Postgres episode-log-that-no-longer-exists are deliberately
# NOT components here -- guardrail/DQ metrics are new panels on Athena's
# existing Grafana (§12.4), and the episode log lives in the Neo4j database
# above (single-database decision) -- both reuse infrastructure that already
# exists rather than duplicating it.
components:
  mcp-server:
    enabled: true
    ports:
      - name: http
        value: 8090
    imageOverride:
      name: "metis-mcp-server"
    useDefault:
      env: true
    env:
      - name: MCP_TRANSPORT
        value: "streamable-http"
      - name: OAUTH_TOKEN_TTL_SECONDS
        value: "3600"   # CONST-064 -- 1 hour access tokens
      - name: OAUTH_REFRESH_TTL_DAYS
        value: "30"     # CONST-064 -- 30 day refresh tokens, revocable
      - name: OAUTH_REVALIDATE_PER_REQUEST
        value: "true"   # CONST-064 -- team/RBAC re-checked every request, not cached from issuance
      # Real bug found deploying this to a real cluster: this component had
      # no METIS_CONFIG_PATH/mountedSecrets at all, so it had no way to ever
      # find config.json -- config_manager.py's ConfigNotFoundError halted
      # the container on startup, every time, regardless of image content.
      - name: METIS_CONFIG_PATH
        value: "/etc/metis/config/config.json"
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 1000m
    livenessProbe:
      httpGet:
        path: /healthz
        port: 8090
      initialDelaySeconds: 10
      periodSeconds: 15
    mountedSecrets:
      - name: metis-config
        mountPath: /etc/metis/config/config.json
        subPath: config.json

  ingestion-worker:
    enabled: true
    ports:
      - name: http
        value: 8091
    imageOverride:
      name: "metis-ingestion-worker"
    useDefault:
      env: true
    env:
      - name: CONNECTOR_MANIFEST_DIR
        value: "/etc/metis/connectors"
      - name: METIS_CONFIG_PATH
        value: "/etc/metis/config/config.json"   # complete deployment config
      # Poll cadence for athena_internal_read-protocol connectors -- matches the
      # per-connector poll_interval_seconds already set in each manifest
      # (e.g. metis-connector-application-code.json's 300s); this env var is a
      # platform-wide default the worker falls back to only if a manifest omits it.
      - name: DEFAULT_POLL_INTERVAL_SECONDS
        value: "300"
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1500m
    mountedConfigMaps:
      - name: connector-manifests
        mountPath: /etc/metis/connectors
    mountedSecrets:
      - name: metis-config
        mountPath: /etc/metis/config/config.json
        subPath: config.json

  guardrail-corpus-runner:
    enabled: true
    kind: cronjob
    schedule: "0 3 * * 0"  # CONST-058 -- weekly is the chart default; CONST-058 itself
                            # requires quarterly at minimum against production data --
                            # weekly here is a stricter, cheap-to-run default since the
                            # corpus is only 12 cases (see the cost review's own token math).
    imageOverride:
      name: "metis-guardrail-corpus-runner"
    useDefault:
      env: true
    env:
      - name: CORPUS_PATH
        value: "/etc/metis/adversarial-injection-corpus.json"
      - name: MIN_PASS_RATE
        value: "1.0"  # CONST-057 -- any failure blocks, does not just warn
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
    mountedConfigMaps:
      - name: adversarial-corpus
        mountPath: /etc/metis/adversarial-injection-corpus.json
        subPath: adversarial-injection-corpus.json

  # Session 10: real staleness + drift detection (metis_mcp/graph_sync.py),
  # same generic CronJob template as guardrail-corpus-runner above -- no
  # new Kubernetes YAML. Real, disclosed scope: proof-wired through one
  # connector (test-suite-ingest) in main(); the mechanism itself is
  # connector-agnostic, so wiring the rest is mechanical follow-up, not a
  # redesign (see metis_mcp/graph_sync.py's own module docstring). NOT
  # live-deployed-and-fired this session -- the only reachable cluster
  # right now is Docker Desktop's, the exact target the Session 9 Podman
  # decision said future cluster work should move away from. helm lint/
  # helm template validate this for real; live CronJob-firing verification
  # needs a kind/minikube-with-podman cluster, a separate setup task.
  metis-graph-sync:
    enabled: true
    kind: cronjob
    schedule: "0 4 * * *"  # daily -- cheap to run (one real connector, this
                            # repo's own test files), and staleness/drift
                            # are meant to be caught quickly, not quarterly
                            # like the adversarial corpus (CONST-058).
    imageOverride:
      name: "metis-graph-sync"
    useDefault:
      env: true
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
