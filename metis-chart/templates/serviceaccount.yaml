{{/*
Real bug found deploying this chart for real (Phase 9): every Pod spec
(_objects.tpl's Deployment and CronJob templates) references
{{ include "metis.serviceAccountName" . }}, but no template anywhere
actually created a ServiceAccount resource -- the chart would fail at pod
admission in any real cluster ("serviceaccount ... not found"), regardless
of whether the container images existed. Never caught before because
`helm template`/`helm lint` had never been run, let alone a real `helm
install`. This is that missing resource.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "metis.serviceAccountName" (dict "serviceAccount" .Values.serviceAccount "Release" .Release) }}
  labels:
    {{- include "metis.labels" (dict "Release" .Release "Chart" .Chart) | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
