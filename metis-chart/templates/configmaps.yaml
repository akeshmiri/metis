apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-metis-config" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "metis.labels" (dict "Release" .Release "Chart" .Chart) | nindent 4 }}
data:
  config.yaml: |
    {{- .Files.Get "files/metis-config.yaml" | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-connector-manifests" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "metis.labels" (dict "Release" .Release "Chart" .Chart) | nindent 4 }}
data:
  {{- range $path, $bytes := .Files.Glob "files/connectors/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-adversarial-corpus" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "metis.labels" (dict "Release" .Release "Chart" .Chart) | nindent 4 }}
data:
  adversarial-injection-corpus.json: |
    {{- .Files.Get "files/metis-adversarial-injection-corpus.json" | nindent 4 }}
