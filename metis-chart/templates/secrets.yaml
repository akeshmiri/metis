{{/*
Secrets are intentionally NOT populated with literal values here or in
values.yaml -- this template documents the expected keys; actual values are
injected via --set-string at install time (from a secrets manager / CI
secret store), never committed to the chart. This mirrors how a platform's own
chart keeps METIS_SOURCE_DB_PASSWORD out of source control in real deployments.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "metis.labels" (dict "Release" .Release "Chart" .Chart) | nindent 4 }}
type: Opaque
stringData:
  # One key, because one is read. `METIS_SOURCE_DB_PASSWORD`, `ANTHROPIC_API_KEY`
  # and `OAUTH_CLIENT_SECRET` were here and no module in this build opens any of
  # them -- a secret nothing reads is a secret somebody still has to rotate.
  METIS_NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | default "REPLACE-AT-INSTALL-TIME" | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-metis-config" .Release.Name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "metis.labels" (dict "Release" .Release "Chart" .Chart) | nindent 4 }}
type: Opaque
stringData:
  config.json: |
    {{- tpl (.Files.Get "files/metis-config.json") . | nindent 4 }}
