# Sandbox overrides.
# Apply with: helm install metis . -f values.yaml -f values-sbx.yaml
#
# **`ingestion-worker` and `guardrail-corpus-runner` were configured here and do
# not exist.** Both went with the v1 engine; `components:` has always held one
# entry. Overriding a component that is not declared is silent — Helm merges the
# map and nothing complains — so this file spent its life configuring nothing
# while reading as the sandbox's tuning.
#
# The list-versus-map warning it carried is still true and still worth knowing:
# Helm merges VALUES MAPS across -f files and REPLACES LISTS wholesale, so an
# `env:` override must restate the whole list rather than the one entry that
# differs.

default:
  replicas: 1

neo4j:
  edition: "community"   # pilot scope — single instance, no HA, zero licensing cost
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: 1000m
