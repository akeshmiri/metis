# The gate that would have caught every packaging defect in the 0.1.0 review.
#
# Two test jobs, because the suite has two halves with very different costs.
# `test` needs no services and finishes in seconds. `extraction` builds real
# CPGs from demo_project/ and needs Joern and a JDK, which is a 1.8GB download.
#
# Splitting them is NOT a licence to skip the slow half. `conftest.py` refuses
# to skip when Joern is missing -- it fails -- precisely so the five query packs
# cannot lose their only behavioural test. That refusal was load-bearing and
# this workflow ignored it: no step ever installed Joern, so every run errored
# in 89 tests. The two jobs below run on the same triggers, and the fast one
# names the files it defers rather than dropping them silently.
#
# The three regeneration checks exist because drift here has already happened
# once: a set of agent files carrying a "GENERATED -- do not hand-edit" banner
# named twelve tools that did not exist.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metis-server
    steps:
      # `fetch-depth: 2`, not the default 1. `actions/checkout` fetches a single
      # commit by default, so `HEAD~1` does not exist — and
      # `test_code_analysis.py::test_changed_files_are_relative_to_the_analysed_directory`
      # asks git for exactly that range. `changed_files` answers an unanswerable
      # range with `[]` rather than raising (deliberately, and there is a test
      # for it), so a shallow checkout surfaced as a bare `assert []` about
      # relative paths — a test failing for a reason it says nothing about.
      #
      # Five, not two. Two is the minimum for `HEAD~1`, and that is not enough:
      # whether the previous commit happened to touch `metis-server` is not a
      # property of this code, and a commit changing only `docs/` left the test
      # SKIPPED — a check that cannot run proves as little as one that cannot
      # fail. The test walks back up to five commits looking for a range that
      # touches this directory, so the depth matches the walk.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - uses: astral-sh/setup-uv@v5

      # **Pinned, and not incidentally.** `docs/guide/cli.md` is generated by
      # capturing argparse's `--help` output verbatim, and argparse changed how
      # it wraps a long subcommand list in 3.13: the trailing `...` moved onto
      # the previous line. So the committed guide matches on 3.13 and differs on
      # 3.10, 3.11 and 3.12, and `test_guide.py` asserts byte equality.
      #
      # Unpinned, `uv venv` took ubuntu's system interpreter, which is 3.12 —
      # every run regenerated a guide that did not match the committed one and
      # failed a test about drift with no drift in it. The `wheel` job already
      # pinned 3.13 for its own reasons; these two now agree with it.
      #
      # `requires-python` stays `>=3.10`: the package genuinely runs there. What
      # is 3.13-specific is the BYTES of one generated page, not the engine.
      - run: uv venv --python 3.13
      - run: uv pip install -e '.[test]'

      # The five engine-dependent files run in `extraction`. Named here, not
      # deselected by a marker, so that adding a sixth is a visible edit in
      # both jobs instead of a test that quietly stops running.
      - name: Test suite (engine-free half)
        run: |
          uv run python -m pytest -q \
            --ignore=test_extraction.py \
            --ignore=test_recipe.py \
            --ignore=test_connectivity.py \
            --ignore=test_data_layer.py \
            --ignore=test_data_cli.py

      # The Cypher schema is generated from ontology/labels.py. A hand-edit is
      # drift, and drift between the two is unfixable once anything has been
      # landed against the wrong constraints.
      - name: Generated schema is current
        run: |
          uv run python -m metis_mcp.ontology.schema --write
          git diff --exit-code -- schema/

      # Agent surfaces are generated from the skills' own frontmatter, for two
      # clients. Regenerating must be a no-op.
      - name: Generated agent surfaces are current
        run: |
          uv run python -c 'from metis_mcp.agent_generator import write; [print(p) for p in write()]'
          git diff --exit-code -- ../.github/agents ../plugins/metis/agents

  # The half that needs an engine. `conftest.py` builds a real CPG from
  # demo_project/, which is what gives the five Joern query packs their only
  # behavioural test -- before it they were checked by grepping the Scala.
  extraction:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: metis-server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # javasrc2cpg needs a JDK. Temurin 21 is what the packs are developed
      # against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # X-3 pins the engine version per pack: a pack verified against one Joern
      # is not verified against another, and the 2.x->4.x storage change broke
      # packs SILENTLY. So the pin is read from the pack manifest rather than
      # written here, and a drifted pin fails the preflight rather than this
      # step.
      - name: Read the pinned engine version
        id: pin
        run: |
          uv venv --python 3.13
          uv pip install -e '.[test]'
          echo "version=$(uv run python -c 'from code_analysis import engine; print(engine.pinned_version())')" >> "$GITHUB_OUTPUT"

      # 1.8GB, so it is cached on the pin. A pin bump misses the cache and
      # downloads the version the packs actually claim.
      - name: Cache Joern
        id: joern-cache
        uses: actions/cache@v4
        with:
          path: ~/joern
          key: joern-linux-x86_64-${{ steps.pin.outputs.version }}

      - name: Install Joern
        if: steps.joern-cache.outputs.cache-hit != 'true'
        run: |
          v="${{ steps.pin.outputs.version }}"
          base="https://github.com/joernio/joern/releases/download/v${v}"
          asset="joern-cli-linux-x86_64.zip"
          mkdir -p ~/joern && cd ~/joern
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL -O "${base}/${asset}.sha512"
          # Verified, not trusted: a truncated 1.8GB download otherwise surfaces
          # as an unreadable Joern version and sends someone to debug the packs.
          #
          # Compared field-by-field rather than with `sha512sum -c`: the published
          # digest names the file as `target/joern-cli-linux-x86_64.zip`, a build
          # path that does not exist here, so `-c` fails on the NAME and reads as
          # a corrupt download.
          expected="$(awk '{print $1}' "${asset}.sha512")"
          actual="$(sha512sum "${asset}" | awk '{print $1}')"
          if [ "$expected" != "$actual" ]; then
            echo "checksum mismatch for ${asset}"; exit 1
          fi
          unzip -q "${asset}"
          rm -f "${asset}" "${asset}.sha512"

      # Resolved by locating the launcher rather than assuming the archive's
      # layout, and failing loudly here if it is not where we think. `joern_home`
      # requires BOTH `joern` and `joern-parse` in the same directory.
      - name: Point Métis at the engine
        run: |
          home="$(dirname "$(find ~/joern -maxdepth 3 -type f -name joern | head -1)")"
          if [ ! -x "$home/joern" ] || [ ! -x "$home/joern-parse" ]; then
            echo "no usable Joern under ~/joern (found: '$home')"; exit 1
          fi
          echo "METIS_JOERN_HOME=$home" >> "$GITHUB_ENV"

      # Reports the install against the pin before any test runs, so a mismatch
      # reads as "wrong engine" instead of as a pack regression.
      #
      # `require(ignore=("graph",))` rather than the `doctor` command: doctor
      # exits 1 on a missing Neo4j password, and there is no graph here by
      # design -- extraction is database-free. Gating on doctor would have made
      # this job fail for a reason that has nothing to do with the engine. The
      # ignore list is the same one conftest.py uses.
      #
      # `astgen` is deliberately NOT ignored. The demo corpus includes a React
      # app and a DOM page, so the JS frontend is required here; when its binary
      # is missing or misnamed the check says which, instead of seven pack tests
      # failing with "Local astgen binary not found".
      - name: Preflight
        run: |
          uv run python -m metis_mcp.mbt.cli doctor || true
          uv run python -c "from code_analysis import engine; engine.preflight().require(ignore=('graph',))"

      - name: Extraction suite
        run: |
          uv run python -m pytest -q \
            test_extraction.py \
            test_recipe.py \
            test_connectivity.py \
            test_data_layer.py \
            test_data_cli.py

  # The wheel is built, installed into an interpreter that has never seen this
  # source tree, and the console script's imports are resolved. `pyproject.toml`
  # once shipped four modules and none of the twelve subpackages; an editable
  # install resolves by path and hid it completely.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: pip wheel --no-deps -w dist/ ./metis-server

      - name: Install into a clean interpreter and resolve the entry point
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python - <<'PY'
          from metis_mcp.server import main
          import metis_mcp.mbt.graph_loader
          import metis_mcp.ontology.labels
          import metis_mcp.workflow.stages
          import code_analysis.openapi
          # Newer subpackages, listed for the same reason as the others: this job
          # exists because pyproject once shipped four modules and none of the
          # twelve subpackages, and an editable install resolves by path and hides
          # it completely. A package added later is exactly as easy to miss.
          import metis_mcp.retrieval
          import metis_mcp.api.auth
          import metis_mcp.api.app
          assert main.__module__ == "metis_mcp.server"
          print("entry point resolves; every subpackage imports")
          PY

      - name: The unused v1 dependencies stay gone
        run: |
          if /tmp/clean/bin/pip list --format=freeze | grep -iE '^(psycopg|pillow|lxml|python-pptx|markdown)'; then
            echo "a dependency with no importer was reintroduced"; exit 1
          fi
