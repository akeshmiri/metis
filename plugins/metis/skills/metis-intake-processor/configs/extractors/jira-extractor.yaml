# Jira Extractor Configuration v1.0.0
# Defines field mappings from Jira to UIF

version: 1.0.0
source_system: jira

# Field mappings: Jira field → UIF target
field_mappings:
  - source_field: "key"
    target: "scope.primary_id"
    transform: "identity"
    
  - source_field: "fields.issuetype.name"
    target: "scope.primary_type"
    transform: "normalize_issue_type"
    
  - source_field: "fields.summary"
    target: "metadata.title"
    transform: "identity"
    
  - source_field: "fields.description"
    target: "metadata.description"
    transform: "truncate_200"
    
  - source_field: "fields.priority.name"
    target: "metadata.priority"
    transform: "normalize_priority"
    
  - source_field: "fields.status.name"
    target: "metadata.status.summary_status"
    transform: "normalize_status"
    
  - source_field: "fields.labels"
    target: "metadata.tags"
    transform: "identity"

# Custom field handling (if configured in Jira)
custom_fields:
  - internal_name: "customfield_10000"
    display_name: "Acceptance Criteria"
    target: "specifications.acceptance_criteria"
    transform: "parse_acceptance_criteria"

# Acceptance criteria parsing patterns
acceptance_criteria_patterns:
  - pattern: "^Given\\s+"
    type: "precondition"
  - pattern: "^When\\s+"
    type: "action"
  - pattern: "^Then\\s+"
    type: "assertion"

# Status normalization
status_normalization:
  "To Do": "draft"
  "In Progress": "active"
  "In Review": "active"
  "Done": "completed"
  "Closed": "completed"

# Priority normalization
priority_normalization:
  "Blocker": "critical"
  "Critical": "critical"
  "High": "high"
  "Medium": "medium"
  "Low": "low"
  "Trivial": "low"

# Issue type normalization
issue_type_normalization:
  "Epic": "epic"
  "Story": "story"
  "Feature": "feature"
  "Task": "task"
  "Bug": "defect"
  "Defect": "defect"
