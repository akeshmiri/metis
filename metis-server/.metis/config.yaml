# Métis project-level configuration.
# Resolution: this file (project-level) overrides ~/.metis/config.yaml
# (host-level) if both exist. First-found-wins, no merge -- see
# config_manager.py's docstring for the full resolution rule.

zdr:
  # Zero Data Retention status for the adopting organization. Fail-closed by
  # default: while `confirmed` is false, any repository classified
  # `confidential` below is blocked at the gate (CONST-051).
  #
  # Record the decision here once made -- see
  # metis-const-053-confirmation-record.md for the procurement checklist and
  # the fields to fill in.
  confirmed: false
  confirmed_date: null
  confirmed_by: null
  note: >
    REPLACE: record the ZDR decision, its date, and the reasoning. Until this
    is filled in, treat the fail-closed default above as intentional rather
    than as an unfinished task.

models:
  extraction: claude-haiku-4-5-20251001
  judge: claude-sonnet-5

corpus:
  # No corpus ships with Métis; point this at your own documents.
  glob: "REPLACE: /absolute/path/to/your/documents/*.md"

# Graph backend. The v1 LocalGraphStore/Neo4jGraphStore split is gone --
# metis_mcp/neo4j_graph_store.py and load_dogfooding_corpus.py went with the v1
# engine. There is one path now: metis_mcp/mbt/graph_session.py, whose driver
# import is deferred so every file-based command runs with no database at all.
# password_env names an environment variable holding the actual secret; the
# secret never lives in this checked-in file (PLT-005).
graph:
  backend: local
  neo4j:
    uri: "bolt://localhost:7687"
    user: "neo4j"
    password_env: "METIS_NEO4J_PASSWORD"

# Per-repository classification (CONST-051/052). Every repository Métis
# ingests should have an explicit entry here -- anything NOT listed defaults
# to `confidential` (fail-closed) and will be blocked, per CONST-052, not
# silently treated as safe.
#
# Given the ZDR decision above, most repositories should genuinely be
# `public_internal` unless a specific one has a real contractual, regulatory,
# or embedded-secrets reason to be stricter -- see the classification
# discussion for guidance on which is which. Defaulting everything to
# `confidential` "to be safe" just means nothing ingests; that's not actually
# safer, it's just inert.
repositories:
  - name: metis-self
    classification: public_internal
    note: "This platform's own design documents -- the Phase 0 dogfooding corpus."

  # - name: REPLACE-your-repo-name
  #   classification: public_internal | confidential | restricted
  #   note: "REPLACE: why this classification, in one line"

# Connector connection settings. Nothing reads these yet: there is no connector
# loader in this build -- see connectors/README.md for what would have to exist.
# The shape is kept because it is the contract a loader would satisfy, and
# because password_env keeps the same indirection as graph.neo4j.password_env
# above: the secret comes from the environment, never from this file (PLT-005).
connectors:
  application_code:
    athena:
      host: "localhost"
      port: 5432
      dbname: "athena_mock"
      user: "athena"
      password_env: "METIS_ATHENA_PASSWORD"

# Transport (Phase 6). 'stdio' is what every Claude Code session so far has
# used -- no OAuth2 needed, sufficient for local single-user dogfooding.
# 'streamable-http' is the production multi-client path (§11.2); it
# requires security.jwt_secret_env to be set (the actual secret lives only
# in that env var, never in this file) and every :User node it authorizes
# against to already exist in Neo4j with a real owner_team.
#
# public_url: the real externally-reachable Streamable HTTP URL
# (docs/historical/design-notes-v1/metis-multi-client-integration.md's REPLACE-metis-host placeholders
# resolve from here) -- consumed by metis_mcp/copilot_integration.py to
# generate .github/agents/spec-aware.agent.md. Unset here deliberately: no
# real hostname/OAuth2 provider has been chosen yet (that doc's own §4).
server:
  transport: stdio
  # public_url: "https://REPLACE-metis-host.example.com/mcp"

security:
  jwt_secret_env: "METIS_JWT_SECRET"

# `token_optimization` was removed: it configured metis_mcp/token_optimization.py
# for three tools (metis_get_context, metis_get_traceability,
# metis_impact_analysis), none of which survived the v1 engine. Response size is
# now a property of the surface itself -- metis_mcp/server.py returns compact,
# pruned JSON and summarises by default -- not a setting.
