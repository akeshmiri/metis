# Query pack: JVM structural extraction (application spec §13.4)
#
# The pack's job is to emit code_analysis.contract's shape. Everything
# downstream consumes the contract, never Joern's raw output -- so an engine
# upgrade touches this pack and nothing else (spec X-3).
name: jvm-structural
version: 0.2.0
contract: metis.cpg-extract/1

engine:
  name: joern
  # X-3: pinned, not a range. Joern's 2.x -> 4.x migration replaced its storage
  # backend; an unpinned engine would break packs silently.
  version: "4.0.604"
  frontends: [javasrc2cpg, jimple2cpg]

layers: [1, 2, 3]          # structural, endpoints, type registry

status: working
verified_against:
  repo: demo_project/records-service
  java_files: 27
  result: "12 endpoints, 5 exception mappings, 0 unparsed. 64 methods declared,
    10 dropped as noise (7 inert accessors, 3 boilerplate), 54 kept."
  # Both directions, and both now go through annotation COMPOSITION rather than
  # a literal name match -- see `composedWith` / `verbOf` in query.sc.
  endpoints_cross_checked: "12 — asserted in test_extraction.py against the
    checked-in corpus, so this is re-runnable rather than recorded"
  routes: ["/record", "/record/{id}", "/record/{id}/archive", "/record/{id}/label",
           "/record/batch", "/record/page", "/summary/{id}", "/json/{id}",
           "/contract/{id}"]
  negative: "ArchiveClient's /store and /store/{id} are absent, and so are
    InternalStoreClient's /internal-store/{id} (a @FeignClient reached through a
    project's own stereotype) and ViewController's /ui/records (Spring MVC: the
    String is a view name, not a response body)"
known_limits:
  # Measured on a real 12-endpoint service: 389 methods declared, 166 inert
  # accessors and 23 boilerplate dropped, 200 kept — 49% of the method nodes were
  # noise. Not by visibility: `private` was 59 of 389 there and two of those were
  # reachable from a handler, one of them guarding an endpoint and raising the
  # exception its @ExceptionHandler maps.
  - "X-5a: inert accessors and generated boilerplate are dropped from `methods` before
     anything downstream reads them, and the counts are reported in `filtered`.
     An accessor qualifies only if a matching field exists, the body is short, and
     it contains no control structure and no call but operators — so a getter that
     branches is kept. Fields are NOT filtered: @Schema and the validation
     constraints live on the field, and `mapper` builds its type registry from
     them. `--param dropNoise=no` keeps everything"
  - "path constants resolve from string-literal assignments only; anything else
     is emitted as __unresolved__ and never guessed (spec T-9d)"
  - "exception_mappings sees @ExceptionHandler + @ResponseStatus only. A handler
     that OVERRIDES a Spring base-class method instead of annotating one is
     invisible: a real service's ControllerErrorHandler extended
     ResponseEntityExceptionHandler and overrides handleMethodArgumentNotValid,
     returning 400 with a different body. It agrees on the status with the
     annotated GlobalExceptionHandler, so nothing is misreported here — but the
     map is not a complete inventory of what maps to what, and must not be read
     as one"
  - "Layers 4-5 (transitions, AC matching) are not in this pack — §13 scope banner"

frameworks:
  # X-10b: classification is configuration; order is a code fact (X-10a).
  spring:
    endpoint_annotations:
      - GetMapping
      - PostMapping
      - PutMapping
      - DeleteMapping
      - PatchMapping
      - RequestMapping
    dimension_classes:
      authentication:
        cross_cutting: true
        matches: [SecurityFilterChain, PreAuthenticated]
      authorization:
        cross_cutting: true
        matches: [PreAuthorize, hasRole, hasAuthority]
      validation:
        cross_cutting: false
        matches: [Valid, Validated, NotNull, NotBlank]

# Provenance. The Spring shapes this pack resolves -- controller stereotypes, meta-annotation composition and inherited mappings -- were read from
# `github/codeql`'s java/ql/lib/semmle/code/java/frameworks/spring/*.qll
# (MIT, (c) GitHub, Inc.). The rule is theirs; the Scala is ours. Nothing
# from CodeQL is installed, invoked or shipped: QL is inert without its
# proprietary engine, which is what makes the libraries usable as a
# specification and useless as a dependency.
