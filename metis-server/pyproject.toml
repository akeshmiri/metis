[project]
name = "metis-mcp-server"
version = "0.1.0"
description = "Métis MCP server — specification and requirements knowledge graph"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "PyYAML>=6.0",
    "neo4j>=5.0.0",
    "psycopg[binary]>=3.0.0",
    "PyJWT>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "jsonschema>=4.0.0",
    "markdown>=3.5",
    "python-pptx>=1.0.0",
]

[project.scripts]
metis-mcp-server = "metis_mcp.server:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["metis_mcp"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
