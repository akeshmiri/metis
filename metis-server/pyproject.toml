[project]
name = "metis-mcp-server"
version = "1.0.0"
description = "Métis MCP server — specification and requirements knowledge graph"
requires-python = ">=3.10"
license = "MIT"
# Only what is imported. Every other distribution that used to be listed here
# (psycopg, PyJWT, uvicorn, starlette, jsonschema, markdown, python-pptx) was
# v1 residue with no importer anywhere in the tree.
#
#   mcp     metis_mcp/server.py
#   neo4j   metis_mcp/mbt/graph_session.py — the driver import is deferred
#           (graph_session.session), so every file-based command and the whole
#           test suite still run with no database. It stays a hard dependency
#           because most of the read-only MCP tools query the graph: an install
#           of `metis-mcp-server` that cannot reach one is not a server. (No
#           count here on purpose — the tool count lives in server.py, and
#           test_documentation_sync.py checks the prose that states it.)
#   PyYAML  code_analysis/openapi.py
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "neo4j>=5.0.0",
    "PyYAML>=6.0",
    # The HTTP API (metis_mcp/api). One package on a tree that was already
    # installed: `mcp` brings starlette, pydantic and uvicorn, which is
    # everything FastAPI needs. `review_ui` argues against a web framework on
    # NF-4 grounds and that argument is weaker than it was — but the part it does
    # not weaken is surface, which is why `api/auth.py` exists.
    "fastapi>=0.110",
]

[project.scripts]
metis-mcp-server = "metis_mcp.server:main"
# The CLI is the fullest surface (N-8) and had no console script at all: it was
# reachable only as `python -m metis_mcp.mbt.cli`, while `engine.py`,
# `project_profile.py` and cli.py's own help told people to run `metis doctor`,
# `metis init`, `metis guide` and `metis frameworks` -- four commands that no
# install produced. `test_structure.py` now checks the entry point resolves.
metis = "metis_mcp.mbt.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "PyYAML",          # pack.yaml manifests are validated, not text-scanned
]
# **Semantic search, and only if you ask for it.** `retrieval.EmbeddingProvider`
# is a Protocol precisely so a default install loads no model; this extra is the
# supported way to get one rather than an argument against that. `model2vec`
# distils a sentence transformer into a lookup table — tens of megabytes, no
# torch, no API key, and deterministic, which `retrieval-bench` needs to measure
# anything. A deployment wanting a stronger model names its own provider.
embeddings = [
    "model2vec>=0.3",
]
# **Joern and a JDK are also required and are not installable from here.**
# `test_extraction.py` builds real CPGs from `demo_project/` and runs the shipped
# query packs, which is the only behavioural test those packs have. A missing
# engine fails rather than skips; `metis doctor` reports it.

# `packages = ["metis_mcp"]` was a literal list, so the wheel shipped four
# top-level modules and none of the twelve subpackages -- an editable install
# resolves by path and hid it. CI now builds, installs and invokes the console
# script, so this cannot regress unseen.
[tool.setuptools.packages.find]
include = ["metis_mcp*", "code_analysis*"]

# The Joern query packs. Nothing resolves them by path at runtime -- a caller
# passes the pack's already-emitted report -- so they ship for usability, not
# for import.
[tool.setuptools.package-data]
code_analysis = ["packs/**/*.sc", "packs/**/*.yaml"]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"
