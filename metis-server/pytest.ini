[pytest]
testpaths = .
python_files = test_*.py
# No `addopts`. Four `--ignore` entries lived here naming test_llm_judge.py,
# test_microrequirement.py, test_calibration.py and
# test_requirement_quality_llm.py -- v1 files deleted in the rebuild. pytest
# accepts an --ignore for a path that does not exist, so they were silent, and a
# stale ignore is how a real test file gets excluded years later by accident.
